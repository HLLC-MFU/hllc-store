<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Card-bottle View</title>
    <link rel="stylesheet" href="./atropos.min.css">
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main class="viewer">
      <header class="viewer-toolbar">
        <div class="viewer-title" id="title">Blessing Card</div>
        <div class="viewer-actions">
          <div class="segmented" aria-label="Card side">
            <button id="frontBtn" type="button">หน้า</button>
            <button id="backBtn" type="button">หลัง</button>
          </div>
          <div class="segmented" aria-label="Language">
            <button id="thBtn" type="button">TH</button>
            <button id="enBtn" type="button">EN</button>
          </div>
        </div>
      </header>
      <section class="viewer-stage" id="stage"></section>
    </main>

    <script src="./cards.js"></script>
    <script src="./atropos.min.js"></script>
    <script src="./view.js"></script>
  </body>
</html>
